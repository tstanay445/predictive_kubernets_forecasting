apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-exporter
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-exporter
  template:
    metadata:
      labels:
        app: nginx-exporter
    spec:
      containers:
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:1.4.2
        args:
        - --nginx.scrape-uri=http://nginx-status:8080/stub_status
        ports:
        - containerPort: 9113
          name: metrics