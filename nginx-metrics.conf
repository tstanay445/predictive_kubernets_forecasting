# Main application server
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }
}

# Metrics server
server {
    listen 8080;

    location /stub_status {
        stub_status;
        allow all;
    }
}