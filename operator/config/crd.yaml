apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: predictiveautoscalers.autoscaling.minorproject.io
spec:
  group: autoscaling.minorproject.io
  names:
    kind: PredictiveAutoscaler
    listKind: PredictiveAutoscalerList
    plural: predictiveautoscalers
    singular: predictiveautoscaler
    shortNames:
      - pa
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Target
          type: string
          jsonPath: .spec.targetDeployment
        - name: Desired
          type: integer
          jsonPath: .status.desiredReplicas
        - name: Current
          type: integer
          jsonPath: .status.currentReplicas
        - name: Demand
          type: number
          jsonPath: .status.lastPredictedDemand
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - targetDeployment
                - predictionURL
                - minReplicas
                - maxReplicas
              properties:
                targetDeployment:
                  type: string
                  description: "Name of the target Deployment to scale"
                predictionURL:
                  type: string
                  description: "HTTP URL to fetch prediction from FastAPI"
                minReplicas:
                  type: integer
                  format: int32
                  minimum: 1
                  description: "Minimum replica count"
                maxReplicas:
                  type: integer
                  format: int32
                  minimum: 1
                  description: "Maximum replica count"
                pollIntervalSeconds:
                  type: integer
                  format: int32
                  default: 30
                  description: "Interval in seconds between prediction polls"
            status:
              type: object
              properties:
                currentReplicas:
                  type: integer
                  format: int32
                desiredReplicas:
                  type: integer
                  format: int32
                lastPredictedDemand:
                  type: number
                  format: double
                lastScaleTime:
                  type: string
                  format: date-time
                message:
                  type: string
